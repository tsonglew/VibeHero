# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    # No `swift test` yet: the package has no Tests target, and `swift test`
    # fails hard ("no tests found") on that. Reinstate together with the
    # localization key-coverage test planned in the README roadmap.
